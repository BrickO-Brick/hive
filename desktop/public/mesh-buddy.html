<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mesh Buddy</title>
    <style>
      :root {
        /* Fallbacks match the buzz-dark theme; overwritten from the app's
           cached theme vars (buzz-theme-cache) at load. */
        --background: 240 6% 7%;
        --foreground: 0 0% 95%;
        --muted-foreground: 240 4% 60%;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }
      .face { width: 220px; height: 150px; }
      .face svg { width: 100%; height: 100%; }
      .eye { fill: hsl(var(--foreground)); }
      .lid { fill: hsl(var(--background)); }
      .stat {
        position: fixed;
        bottom: 7px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: hsl(var(--muted-foreground));
        font-variant-numeric: tabular-nums;
      }
      #tokens { left: 10px; }
      #nodes { right: 10px; }
    </style>
  </head>
  <body>
    <div class="face">
      <svg viewBox="0 0 160 110" aria-label="mesh buddy face" role="img">
        <g id="rig">
          <ellipse class="eye" id="eyeL" />
          <ellipse class="eye" id="eyeR" />
          <!-- Lower lids: background-colored masks that slide up for the
               happy squint, carving a smooth crescent out of each eye. -->
          <ellipse class="lid" id="lidL" rx="30" ry="24" />
          <ellipse class="lid" id="lidR" rx="30" ry="24" />
        </g>
      </svg>
    </div>
    <div class="stat" id="tokens">tok 0</div>
    <div class="stat" id="nodes">&nbsp;</div>
    <script>
      // Follow the app theme: the main window caches its resolved CSS vars in
      // localStorage (same origin), so apply them and re-check on focus and on
      // cross-window storage events.
      function applyTheme() {
        try {
          const cached = window.localStorage.getItem("buzz-theme-cache");
          if (!cached) return;
          const { vars } = JSON.parse(cached);
          for (const [key, value] of Object.entries(vars || {})) {
            document.documentElement.style.setProperty(key, value);
          }
        } catch {
          // Keep fallbacks.
        }
      }
      applyTheme();
      window.addEventListener("storage", applyTheme);
      window.addEventListener("focus", applyTheme);

      // ---- Procedural round eyes (Cozmo/Vector style) --------------------
      // One parameter set eased toward the active expression every frame, so
      // mood changes, blinks, gaze shifts, and screen-position tracking are
      // all smooth morphs of the same two ellipses. Inspired by procedural
      // expression polygons: github.com/ggldnl/Procedural-Expression-Library
      //
      // Params: rx/ry radii, curve (lower-lid rise: happy squint), y offset.
      const EXPRESSIONS = {
        sleeping: { rx: 20, ry: 2.5, curve: 0, y: 14 },
        waking: { rx: 17, ry: 10, curve: 0, y: 5 },
        neutral: { rx: 17, ry: 20, curve: 0, y: 0 },
        happy: { rx: 19, ry: 18, curve: 15, y: -2 },
        tired: { rx: 18, ry: 6, curve: 0, y: 9 },
      };
      const CENTERS = [46, 114]; // eye x-centers in the 160x110 viewBox
      const MID_Y = 52;

      const rig = {
        current: { ...EXPRESSIONS.sleeping, gx: 0, gy: 0 },
        target: { ...EXPRESSIONS.sleeping, gx: 0, gy: 0 },
        mood: "sleeping",
        // Where the eyes point: screen-center tracking + idle drift.
        screenGaze: { x: 0, y: 0 },
        driftGaze: { x: 0, y: 0 },
        blink: 1, // height multiplier; dips toward 0 during a blink
        blinkPhase: "open",
        nextBlinkAt: performance.now() + 2500,
      };

      const eyeL = document.getElementById("eyeL");
      const eyeR = document.getElementById("eyeR");
      const lidL = document.getElementById("lidL");
      const lidR = document.getElementById("lidR");

      function placeEye(eye, lid, cx, p, blink) {
        const ry = Math.max(1.5, p.ry * blink);
        const x = cx + p.gx;
        const y = MID_Y + p.y + p.gy;
        eye.setAttribute("cx", x);
        eye.setAttribute("cy", y);
        eye.setAttribute("rx", p.rx);
        eye.setAttribute("ry", ry);
        // Lower-lid mask: top edge rises `curve` px into the eye from below.
        const rise = Math.max(0, p.curve) * blink;
        lid.setAttribute("cx", x);
        lid.setAttribute("cy", y + ry - rise + 24);
      }

      function stepBlink(now) {
        if (rig.mood === "sleeping" || rig.mood === "tired") {
          rig.blink = 1;
          rig.blinkPhase = "open";
          return;
        }
        if (rig.blinkPhase === "open" && now >= rig.nextBlinkAt) {
          rig.blinkPhase = "closing";
        }
        if (rig.blinkPhase === "closing") {
          rig.blink = Math.max(0.08, rig.blink - 0.28);
          if (rig.blink <= 0.08) rig.blinkPhase = "opening";
        } else if (rig.blinkPhase === "opening") {
          rig.blink = Math.min(1, rig.blink + 0.22);
          if (rig.blink >= 1) {
            rig.blinkPhase = "open";
            rig.nextBlinkAt = now + 2200 + Math.random() * 4200;
          }
        }
      }

      let lastDriftShift = 0;
      function stepGaze(now) {
        if (rig.mood === "sleeping") {
          rig.target.gx = 0;
          rig.target.gy = 0;
          return;
        }
        if (
          rig.mood === "neutral" &&
          now - lastDriftShift > 2800 + Math.random() * 1500
        ) {
          lastDriftShift = now;
          rig.driftGaze.x = (Math.random() - 0.5) * 8;
          rig.driftGaze.y = (Math.random() - 0.5) * 4;
        }
        if (rig.mood !== "neutral") {
          rig.driftGaze.x = 0;
          rig.driftGaze.y = 0;
        }
        rig.target.gx = rig.screenGaze.x + rig.driftGaze.x;
        rig.target.gy = rig.screenGaze.y + rig.driftGaze.y;
      }

      function frame(now) {
        stepBlink(now);
        stepGaze(now);
        const c = rig.current;
        const t = rig.target;
        for (const key of ["rx", "ry", "curve", "y", "gx", "gy"]) {
          c[key] += (t[key] - c[key]) * 0.12;
        }
        // Sleeping breathes: a slow, gentle bob.
        const breath = rig.mood === "sleeping" ? Math.sin(now / 900) * 1.6 : 0;
        const p = { ...c, y: c.y + breath };
        placeEye(eyeL, lidL, CENTERS[0], p, rig.blink);
        placeEye(eyeR, lidR, CENTERS[1], p, rig.blink);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      function setMood(mood) {
        if (rig.mood === mood) return;
        rig.mood = mood;
        rig.target = { ...EXPRESSIONS[mood], gx: rig.target.gx, gy: rig.target.gy };
      }

      // ---- Look toward the center of the screen --------------------------
      // Poll the window's position on its monitor; the eyes aim from the
      // window's center toward the monitor's center. Top-right corner means
      // look left and down. Falls back to straight ahead if the window
      // permissions are unavailable.
      const invoke =
        window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke;
      const LABEL = "mesh-buddy";
      async function pollGaze() {
        if (!invoke) return;
        try {
          const [pos, size, monitor] = await Promise.all([
            invoke("plugin:window|outer_position", { label: LABEL }),
            invoke("plugin:window|outer_size", { label: LABEL }),
            invoke("plugin:window|current_monitor", { label: LABEL }),
          ]);
          if (!pos || !size || !monitor) return;
          const winCx = pos.x + size.width / 2;
          const winCy = pos.y + size.height / 2;
          const monCx = monitor.position.x + monitor.size.width / 2;
          const monCy = monitor.position.y + monitor.size.height / 2;
          const nx = (monCx - winCx) / (monitor.size.width / 2);
          const ny = (monCy - winCy) / (monitor.size.height / 2);
          rig.screenGaze.x = Math.max(-1, Math.min(1, nx)) * 9;
          rig.screenGaze.y = Math.max(-1, Math.min(1, ny)) * 6;
        } catch {
          rig.screenGaze.x = 0;
          rig.screenGaze.y = 0;
        }
      }
      pollGaze();
      setInterval(pollGaze, 500);

      // ---- State from the mesh runtime ------------------------------------
      async function tick() {
        if (!invoke) return;
        try {
          const [usage, status] = await Promise.all([
            invoke("mesh_serving_usage"),
            invoke("mesh_node_status"),
          ]);
          const tokens = usage?.tokensServed || 0;
          const inflight = usage?.inflight || 0;
          document.getElementById("tokens").textContent =
            "tok " + tokens.toLocaleString();
          const nodes = (usage?.peers || 0) + 1;
          document.getElementById("nodes").textContent = nodes + " node" + (nodes === 1 ? "" : "s");
          const state = status?.state;
          if (state === "running") setMood(inflight > 0 ? "happy" : "neutral");
          else if (state === "starting") setMood("waking");
          else if (state === "failed") setMood("tired");
          else setMood("sleeping");
        } catch {
          setMood("sleeping");
        }
      }
      tick();
      setInterval(tick, 2000);
    </script>
  </body>
</html>
