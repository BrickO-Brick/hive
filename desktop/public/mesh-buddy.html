<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mesh Buddy</title>
    <style>
      :root {
        /* Fallbacks match the buzz-dark theme; overwritten from the app's
           cached theme vars (buzz-theme-cache) at load. */
        --background: 240 6% 7%;
        --foreground: 0 0% 95%;
        --muted-foreground: 240 4% 60%;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }
      .face { width: 220px; height: 150px; }
      .face svg { width: 100%; height: 100%; }
      .eye { fill: hsl(var(--foreground)); }
      .lid { fill: hsl(var(--background)); }
      .stat {
        position: fixed;
        bottom: 7px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: hsl(var(--muted-foreground));
        font-variant-numeric: tabular-nums;
      }
      #tokens { left: 10px; }
      #nodes { right: 10px; }
    </style>
  </head>
  <body>
    <div class="face">
      <svg viewBox="0 0 160 110" aria-label="mesh buddy face" role="img">
        <g id="rig">
          <!-- RoboEyes-style rig on elliptical eyes with real pupils.
               Pupils and lids are background-colored, so the face stays
               strictly two-tone in any theme. -->
          <ellipse class="eye" id="eyeL" />
          <ellipse class="eye" id="eyeR" />
          <circle class="lid" id="pupilL" />
          <circle class="lid" id="pupilR" />
          <!-- Angled upper lids: angry (inner edge drops) / tired (outer
               edge drops), a la FluxGarage RoboEyes. -->
          <polygon class="lid" id="browL" />
          <polygon class="lid" id="browR" />
          <!-- Lower lids slide up for the happy squint crescent. -->
          <ellipse class="lid" id="lidL" rx="30" ry="24" />
          <ellipse class="lid" id="lidR" rx="30" ry="24" />
        </g>
      </svg>
    </div>
    <div class="stat" id="tokens">tok 0</div>
    <div class="stat" id="nodes">&nbsp;</div>
    <script>
      // Follow the app theme: the main window caches its resolved CSS vars in
      // localStorage (same origin), so apply them and re-check on focus and on
      // cross-window storage events.
      function applyTheme() {
        try {
          const cached = window.localStorage.getItem("buzz-theme-cache");
          if (!cached) return;
          const { vars } = JSON.parse(cached);
          for (const [key, value] of Object.entries(vars || {})) {
            document.documentElement.style.setProperty(key, value);
          }
        } catch {
          // Keep fallbacks.
        }
      }
      applyTheme();
      window.addEventListener("storage", applyTheme);
      window.addEventListener("focus", applyTheme);

      // ---- Procedural eyes (FluxGarage RoboEyes style) --------------------
      // Rounded-square eyes with a real pupil, all morphed from one eased
      // parameter set every frame. Pupils/lids are background-colored so the
      // face stays strictly monochrome. github.com/FluxGarage/RoboEyes
      //
      // Params: w/h (ellipse axes), curve (happy squint rise),
      // y offset, brow (+1 angry inner slant, -1 tired outer slant),
      // pupil (0..1 pupil size).
      const EXPRESSIONS = {
        sleeping: { w: 36, h: 3, curve: 0, y: 14, brow: 0, pupil: 0 },
        waking: { w: 34, h: 20, curve: 0, y: 5, brow: 0, pupil: 0.6 },
        neutral: { w: 34, h: 38, curve: 0, y: 0, brow: 0, pupil: 1 },
        happy: { w: 34, h: 36, curve: 14, y: -2, brow: 0, pupil: 1 },
        tired: { w: 34, h: 24, curve: 0, y: 7, brow: -0.7, pupil: 0.85 },
        angry: { w: 34, h: 30, curve: 0, y: 2, brow: 0.8, pupil: 0.9 },
      };
      const CENTERS = [46, 114]; // eye x-centers in the 160x110 viewBox
      const MID_Y = 52;

      const rig = {
        current: { ...EXPRESSIONS.sleeping, gx: 0, gy: 0 },
        target: { ...EXPRESSIONS.sleeping, gx: 0, gy: 0 },
        mood: "sleeping",
        // Where the eyes point: screen-center tracking + idle drift.
        screenGaze: { x: 0, y: 0 },
        driftGaze: { x: 0, y: 0 },
        blink: 1, // height multiplier; dips toward 0 during a blink
        blinkPhase: "open",
        nextBlinkAt: performance.now() + 2500,
        // Micro-animations: transient offsets layered on the rig.
        anim: null, // { kind: "laugh"|"confused", start }
        nextAnimAt: performance.now() + 6000,
      };

      const el = (id) => document.getElementById(id);
      const eyes = [
        { eye: el("eyeL"), pupil: el("pupilL"), brow: el("browL"), lid: el("lidL") },
        { eye: el("eyeR"), pupil: el("pupilR"), brow: el("browR"), lid: el("lidR") },
      ];

      function placeEye(parts, cx, p, blink, side, shakeX, bounceY) {
        // Curious side-glance: the eye on the side we look toward grows a
        // touch, the other shrinks (RoboEyes "curious" mode).
        const curious = Math.max(-1, Math.min(1, p.gx / 9)) * side * 0.14;
        const h = Math.max(2, p.h * blink * (1 + curious));
        const w = p.w * (1 + curious * 0.4);
        const x = cx + p.gx + shakeX;
        const y = MID_Y + p.y + p.gy + bounceY;
        parts.eye.setAttribute("cx", x);
        parts.eye.setAttribute("cy", y);
        parts.eye.setAttribute("rx", w / 2);
        parts.eye.setAttribute("ry", h / 2);

        // Pupil: background-colored, leads the gaze slightly so the eye
        // reads as actually looking. Rides up during the happy squint so it
        // never lumps the crescent's silhouette; hidden when nearly shut.
        const rise0 = Math.max(0, p.curve) * blink;
        const pr = 6.5 * p.pupil * Math.min(1, (h - 8) / 14);
        if (pr > 0.8) {
          parts.pupil.setAttribute("cx", x + p.gx * 0.45);
          parts.pupil.setAttribute("cy", y + p.gy * 0.5 - rise0 * 0.6);
          parts.pupil.setAttribute("r", pr);
        } else {
          parts.pupil.setAttribute("r", 0);
        }

        // Angled upper lid: angry drops the inner edge, tired the outer.
        const top = y - h / 2;
        const drop = Math.abs(p.brow) * h * 0.55;
        if (drop > 0.5) {
          const inner = side > 0 ? x - w / 2 - 2 : x + w / 2 + 2;
          const outer = side > 0 ? x + w / 2 + 2 : x - w / 2 - 2;
          const dInner = p.brow > 0 ? drop : 0;
          const dOuter = p.brow > 0 ? 0 : drop;
          parts.brow.setAttribute(
            "points",
            `${outer},${top - 8} ${inner},${top - 8} ` +
              `${inner},${top + dInner} ${outer},${top + dOuter}`
          );
        } else {
          parts.brow.setAttribute("points", "");
        }

        // Lower-lid mask: top edge rises `curve` px into the eye from below.
        const rise = Math.max(0, p.curve) * blink;
        parts.lid.setAttribute("cx", x);
        parts.lid.setAttribute("cy", y + h / 2 - rise + 24);
      }

      function stepBlink(now) {
        if (rig.mood === "sleeping" || rig.mood === "tired") {
          rig.blink = 1;
          rig.blinkPhase = "open";
          return;
        }
        if (rig.blinkPhase === "open" && now >= rig.nextBlinkAt) {
          rig.blinkPhase = "closing";
        }
        if (rig.blinkPhase === "closing") {
          rig.blink = Math.max(0.08, rig.blink - 0.28);
          if (rig.blink <= 0.08) rig.blinkPhase = "opening";
        } else if (rig.blinkPhase === "opening") {
          rig.blink = Math.min(1, rig.blink + 0.22);
          if (rig.blink >= 1) {
            rig.blinkPhase = "open";
            rig.nextBlinkAt = now + 2200 + Math.random() * 4200;
          }
        }
      }

      let lastDriftShift = 0;
      function stepGaze(now) {
        if (rig.mood === "sleeping") {
          rig.target.gx = 0;
          rig.target.gy = 0;
          return;
        }
        if (
          rig.mood === "neutral" &&
          now - lastDriftShift > 2800 + Math.random() * 1500
        ) {
          lastDriftShift = now;
          rig.driftGaze.x = (Math.random() - 0.5) * 8;
          rig.driftGaze.y = (Math.random() - 0.5) * 4;
        }
        if (rig.mood !== "neutral") {
          rig.driftGaze.x = 0;
          rig.driftGaze.y = 0;
        }
        rig.target.gx = rig.screenGaze.x + rig.driftGaze.x;
        rig.target.gy = rig.screenGaze.y + rig.driftGaze.y;
      }

      // Micro-animations (RoboEyes anim_confused / anim_laugh): confused is
      // a quick horizontal shake, laugh a vertical bounce. Fired occasionally
      // while awake, and on entering the matching mood.
      function stepAnim(now) {
        if (!rig.anim && rig.mood === "neutral" && now >= rig.nextAnimAt) {
          rig.anim = {
            kind: Math.random() < 0.5 ? "confused" : "laugh",
            start: now,
          };
        }
        if (!rig.anim) return { shakeX: 0, bounceY: 0 };
        const t = (now - rig.anim.start) / 500;
        if (t >= 1) {
          rig.anim = null;
          rig.nextAnimAt = now + 9000 + Math.random() * 14000;
          return { shakeX: 0, bounceY: 0 };
        }
        const decay = 1 - t;
        const wobble = Math.sin(t * Math.PI * 6) * 4 * decay;
        return rig.anim.kind === "confused"
          ? { shakeX: wobble, bounceY: 0 }
          : { shakeX: 0, bounceY: wobble };
      }

      function frame(now) {
        stepBlink(now);
        stepGaze(now);
        const { shakeX, bounceY } = stepAnim(now);
        const c = rig.current;
        const t = rig.target;
        for (const key of ["w", "h", "curve", "y", "brow", "pupil", "gx", "gy"]) {
          c[key] += (t[key] - c[key]) * 0.12;
        }
        // Sleeping breathes: a slow, gentle bob.
        const breath = rig.mood === "sleeping" ? Math.sin(now / 900) * 1.6 : 0;
        const p = { ...c, y: c.y + breath };
        placeEye(eyes[0], CENTERS[0], p, rig.blink, -1, shakeX, bounceY);
        placeEye(eyes[1], CENTERS[1], p, rig.blink, 1, shakeX, bounceY);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      function setMood(mood) {
        if (rig.mood === mood) return;
        rig.mood = mood;
        rig.target = { ...EXPRESSIONS[mood], gx: rig.target.gx, gy: rig.target.gy };
        // Punctuate mood entries: happy giggles, failure gets a rattled shake.
        if (mood === "happy")
          rig.anim = { kind: "laugh", start: performance.now() };
        if (mood === "angry")
          rig.anim = { kind: "confused", start: performance.now() };
      }

      // ---- Look toward the center of the screen --------------------------
      // Poll the window's position on its monitor; the eyes aim from the
      // window's center toward the monitor's center. Top-right corner means
      // look left and down. Falls back to straight ahead if the window
      // permissions are unavailable.
      const invoke =
        window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke;
      const LABEL = "mesh-buddy";
      async function pollGaze() {
        if (!invoke) return;
        try {
          const [pos, size, monitor] = await Promise.all([
            invoke("plugin:window|outer_position", { label: LABEL }),
            invoke("plugin:window|outer_size", { label: LABEL }),
            invoke("plugin:window|current_monitor", { label: LABEL }),
          ]);
          if (!pos || !size || !monitor) return;
          const winCx = pos.x + size.width / 2;
          const winCy = pos.y + size.height / 2;
          const monCx = monitor.position.x + monitor.size.width / 2;
          const monCy = monitor.position.y + monitor.size.height / 2;
          const nx = (monCx - winCx) / (monitor.size.width / 2);
          const ny = (monCy - winCy) / (monitor.size.height / 2);
          rig.screenGaze.x = Math.max(-1, Math.min(1, nx)) * 9;
          rig.screenGaze.y = Math.max(-1, Math.min(1, ny)) * 6;
        } catch {
          rig.screenGaze.x = 0;
          rig.screenGaze.y = 0;
        }
      }
      pollGaze();
      setInterval(pollGaze, 500);

      // ---- State from the mesh runtime ------------------------------------
      async function tick() {
        if (!invoke) return;
        try {
          const [usage, status] = await Promise.all([
            invoke("mesh_serving_usage"),
            invoke("mesh_node_status"),
          ]);
          const tokens = usage?.tokensServed || 0;
          const inflight = usage?.inflight || 0;
          document.getElementById("tokens").textContent =
            "tok " + tokens.toLocaleString();
          const nodes = (usage?.peers || 0) + 1;
          document.getElementById("nodes").textContent = nodes + " node" + (nodes === 1 ? "" : "s");
          const state = status?.state;
          if (state === "running") setMood(inflight > 0 ? "happy" : "neutral");
          else if (state === "starting") setMood("waking");
          else if (state === "stopping") setMood("tired");
          else if (state === "failed") setMood("angry");
          else setMood("sleeping");
        } catch {
          setMood("sleeping");
        }
      }
      tick();
      setInterval(tick, 2000);
    </script>
  </body>
</html>
