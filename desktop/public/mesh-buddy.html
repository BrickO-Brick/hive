<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mesh Buddy</title>
    <style>
      :root {
        /* Fallbacks match the buzz-dark theme; overwritten from the app's
           cached theme vars (buzz-theme-cache) at load. */
        --background: 240 6% 7%;
        --foreground: 0 0% 95%;
        --muted-foreground: 240 4% 60%;
        --status-added: 145 45% 55%;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: -apple-system, "Inter", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: default;
      }
      .wrap { text-align: center; }
      .face { font-size: 96px; line-height: 1; }
      .count {
        margin-top: 18px;
        font-size: 40px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .label {
        margin-top: 6px;
        font-size: 12px;
        color: hsl(var(--muted-foreground));
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .nodes {
        margin-top: 14px;
        font-size: 13px;
        color: hsl(var(--status-added));
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="face" id="face">🙂</div>
      <div class="count" id="count">0</div>
      <div class="label">tokens helped compute</div>
      <div class="nodes" id="nodes">&nbsp;</div>
    </div>
    <script>
      // Follow the app theme: the main window caches its resolved CSS vars in
      // localStorage (same origin), so apply them and re-check on focus and on
      // cross-window storage events.
      function applyTheme() {
        try {
          const cached = window.localStorage.getItem("buzz-theme-cache");
          if (!cached) return;
          const { vars } = JSON.parse(cached);
          for (const [key, value] of Object.entries(vars || {})) {
            document.documentElement.style.setProperty(key, value);
          }
        } catch {
          // Keep fallbacks.
        }
      }
      applyTheme();
      window.addEventListener("storage", applyTheme);
      window.addEventListener("focus", applyTheme);

      const invoke =
        window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke;
      async function tick() {
        if (!invoke) return;
        try {
          const usage = await invoke("mesh_serving_usage");
          const tokens = usage?.tokensServed || 0;
          const inflight = usage?.inflight || 0;
          document.getElementById("count").textContent = tokens.toLocaleString();
          document.getElementById("face").textContent =
            inflight > 0 ? "😄" : tokens > 0 ? "😊" : "🙂";
          const nodes = (usage?.peers || 0) + 1;
          document.getElementById("nodes").textContent =
            nodes + (nodes === 1 ? " active node in mesh" : " active nodes in mesh");
        } catch {
          // Mesh not running — keep whatever is shown.
        }
      }
      tick();
      setInterval(tick, 2000);
    </script>
  </body>
</html>
