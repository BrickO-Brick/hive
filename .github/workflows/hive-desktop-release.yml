name: Hive Desktop Release

on:
  push:
    tags:
      - "desktop-v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Stable X.Y.Z version to build without publishing
        required: true
        type: string

concurrency:
  group: hive-desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPDATER_ENDPOINT: https://github.com/BrickO-Brick/hive/releases/download/hive-desktop-latest/latest.json

jobs:
  setup:
    if: github.repository == 'BrickO-Brick/hive'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Validate release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#desktop-v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Hive desktop releases require a stable X.Y.Z tag"
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            scripts/verify-release-ref.sh desktop-v "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: source
        run: echo "sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (${{ matrix.arch }})
    needs: setup
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            suffix: aarch64
          - arch: intel
            target: x86_64-apple-darwin
            suffix: x64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - run: rustup target add "${{ matrix.target }}"
      - run: just desktop-install-ci
      - name: Patch release version
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace
      - name: Generate updater-enabled release config
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
        run: cd desktop && node scripts/build-release-config.mjs
      - name: Build sidecars
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"
      - name: Build macOS app and DMG
        env:
          TARGET: ${{ matrix.target }}
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: cd desktop && pnpm tauri build --verbose --no-sign --target "$TARGET" --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Ad-hoc sign app and rebuild distributable artifacts
        id: artifacts
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ needs.setup.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle="desktop/src-tauri/target/${TARGET}/release/bundle"
          app="$bundle/macos/Hive.app"
          [[ -d "$app" ]] || { echo "::error::Hive.app not found"; exit 1; }
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          archive="$GITHUB_WORKSPACE/$bundle/macos/Hive_${VERSION}_${SUFFIX}.app.tar.gz"
          tar -C "$bundle/macos" -czf "$archive" Hive.app
          (cd desktop && pnpm tauri signer sign "$archive")

          dmg="$GITHUB_WORKSPACE/$bundle/dmg/Hive_${VERSION}_${SUFFIX}.dmg"
          rm -f "$dmg"
          hdiutil create -quiet -volname Hive -srcfolder "$app" -ov -format UDZO "$dmg"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hive-desktop-macos-${{ matrix.suffix }}
          if-no-files-found: error
          path: |
            ${{ steps.artifacts.outputs.dmg }}
            ${{ steps.artifacts.outputs.archive }}
            ${{ steps.artifacts.outputs.archive }}.sig

  windows:
    name: Windows (x64)
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0
      - run: pnpm install --frozen-lockfile
      - name: Patch release version
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace
      - name: Generate updater-enabled release config
        shell: bash
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
        run: cd desktop && node scripts/build-release-config.mjs
      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"
      - name: Build NSIS installer
        shell: bash
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cd desktop && pnpm tauri build --verbose --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Locate Windows artifacts
        id: artifacts
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          bundle="desktop/src-tauri/target/${TARGET}/release/bundle/nsis"
          installer=$(find "$bundle" -name '*.exe' -type f | head -1)
          [[ -n "$installer" && -f "${installer}.sig" ]] || { echo "::error::signed updater installer not found"; exit 1; }
          renamed="$bundle/Hive_${VERSION}_x64-setup_alpha-unsigned.exe"
          mv "$installer" "$renamed"
          mv "${installer}.sig" "${renamed}.sig"
          echo "installer=$renamed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hive-desktop-windows-x64
          if-no-files-found: error
          path: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.installer }}.sig

  publish:
    name: Validate and publish Hive desktop release
    needs: [setup, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.setup.outputs.version }}
      SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hive-desktop-*
          path: staged
          merge-multiple: true
      - name: Generate signed updater manifest
        env:
          UPDATER_PRODUCT_NAME: Hive
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-v${VERSION}"
          bash desktop/scripts/generate-oss-latest-json.sh "$VERSION" \
            "darwin-aarch64:staged/macos/Hive_${VERSION}_aarch64.app.tar.gz.sig:${base}/Hive_${VERSION}_aarch64.app.tar.gz" \
            "darwin-x86_64:staged/macos/Hive_${VERSION}_x64.app.tar.gz.sig:${base}/Hive_${VERSION}_x64.app.tar.gz" \
            "windows-x86_64:staged/Hive_${VERSION}_x64-setup_alpha-unsigned.exe.sig:${base}/Hive_${VERSION}_x64-setup_alpha-unsigned.exe" \
            > staged/latest.json
          cp staged/latest.json staged/updater-manifest.json
      - name: Publish immutable version and rolling updater releases
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          set -euo pipefail
          tag="desktop-v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            [[ "$draft" == "true" ]] || { echo "::error::$tag is already published and immutable"; exit 1; }
            release_tag=$(gh release view "$tag" --json tagName --jq .tagName)
            target=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_tag}" --jq .sha)
            [[ "$target" == "$SOURCE_SHA" ]] || { echo "::error::$tag resolves to $target, expected $SOURCE_SHA"; exit 1; }
          else
            gh release create "$tag" --verify-tag --draft --title "Hive Desktop v${VERSION}" --notes "Hive ${VERSION} for macOS and Windows. The app checks this signed update channel automatically."
          fi
          mapfile -t assets < <(find staged -type f ! -name latest.json -print)
          gh release upload "$tag" "${assets[@]}" --clobber
          gh release edit "$tag" --draft=false --latest

          rolling="hive-desktop-latest"
          if ! gh release view "$rolling" >/dev/null 2>&1; then
            gh release create "$rolling" --target "$SOURCE_SHA" --draft --title "Hive Desktop Latest" --notes "Signed auto-update metadata for Hive desktop."
            gh release upload "$rolling" staged/latest.json
            gh release edit "$rolling" --draft=false --prerelease
          else
            gh release upload "$rolling" staged/latest.json --clobber
          fi
