name: Hive OneBrick

on:
  pull_request:
    paths:
      - Dockerfile
      - deploy/onebrick/**
      - scripts/*hive*.sh
      - scripts/preflight.sh
      - scripts/deploy.sh
      - scripts/healthcheck.sh
      - scripts/backup.sh
      - scripts/restore.sh
      - scripts/restore-test.sh
      - scripts/upgrade.sh
      - scripts/rollback.sh
      - scripts/deploy-aws-ssh.sh
      - .github/workflows/hive-onebrick.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - deploy/onebrick/**
      - scripts/*hive*.sh
      - scripts/preflight.sh
      - scripts/deploy.sh
      - scripts/healthcheck.sh
      - scripts/backup.sh
      - scripts/restore.sh
      - scripts/restore-test.sh
      - scripts/upgrade.sh
      - scripts/rollback.sh
      - scripts/deploy-aws-ssh.sh
      - .github/workflows/hive-onebrick.yml
permissions:
  contents: read

concurrency:
  group: hive-onebrick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate shell syntax
        run: |
          scripts=(scripts/{hive-common,preflight,deploy,healthcheck,backup,restore,restore-test,upgrade,rollback,bootstrap-secrets,build-images,deploy-aws-ssh}.sh deploy/onebrick/agent/entrypoint.sh)
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"
      - name: Validate environment contract and Compose
        run: |
          fixture="$(mktemp)"
          cp deploy/onebrick/.env.example "$fixture"
          digest="$(printf 'a%.0s' {1..64})"
          sed -i \
            -e "s/CHANGE_ME_RELAY_IMAGE_DIGEST/$digest/" \
            -e "s/CHANGE_ME_AGENT_IMAGE_DIGEST/$digest/" \
            -e "s/CHANGE_ME_64_HEX_OWNER_PUBKEY/$(printf '1%.0s' {1..64})/" \
            -e "s/CHANGE_ME_64_HEX_RELAY_PRIVATE_KEY/$(printf '2%.0s' {1..64})/" \
            -e "s/CHANGE_ME_64_HEX_BRICKO_PRIVATE_KEY/$(printf '3%.0s' {1..64})/" \
            -e 's/CHANGE_ME_RANDOM_64_HEX/test-only-not-a-secret/g' \
            -e 's/CHANGE_ME_RANDOM_PASSWORD/test-only-not-a-secret/g' \
            -e 's/CHANGE_ME_RANDOM_ACCESS_KEY/test-only-not-a-secret/g' \
            -e 's/CHANGE_ME_RANDOM_SECRET_KEY/test-only-not-a-secret/g' \
            -e 's/CHANGE_ME_GITHUB_FINE_GRAINED_READ_TOKEN/test-only-github-read-token/g' \
            "$fixture"
          chmod 0600 "$fixture"
          HIVE_ENV_FILE="$fixture" docker compose -p hive-ci --env-file "$fixture" -f deploy/onebrick/compose.yml config --quiet
          HIVE_ENV_FILE="$fixture" docker compose -p hive-ci --env-file "$fixture" -f deploy/onebrick/compose.yml config \
            | grep -Fq 'name: onebrick-stack_private_net'
          agent_config="$(HIVE_ENV_FILE="$fixture" docker compose --profile agent -p hive-ci --env-file "$fixture" -f deploy/onebrick/compose.yml config)"
          grep -Fq 'BUZZ_RELAY_URL: wss://hive.onebrick.io' <<<"$agent_config"
          grep -Fq 'BUZZ_ACP_PERMISSION_MODE: dont-ask' <<<"$agent_config"
          grep -Fq 'BUZZ_ACP_RESPOND_TO: anyone' <<<"$agent_config"
          grep -Fq 'BUZZ_ACP_NO_MENTION_FILTER: "true"' <<<"$agent_config"
          jq -e --arg owner "$(printf '1%.0s' {1..64})" \
            '.services["bricko-agent"].environment.BUZZ_ACP_AGENT_OWNER == $owner' \
            <<<"$(HIVE_ENV_FILE="$fixture" docker compose --profile agent -p hive-ci --env-file "$fixture" -f deploy/onebrick/compose.yml config --format json)" \
            >/dev/null
          jq -e \
            '.services["bricko-agent"].environment.INITIAL_AGENT_MODE == "agent-full-access"' \
            <<<"$(HIVE_ENV_FILE="$fixture" docker compose --profile agent -p hive-ci --env-file "$fixture" -f deploy/onebrick/compose.yml config --format json)" \
            >/dev/null
          grep -Fq 'init: false' <<<"$agent_config"
          grep -Fq 'INITIAL_AGENT_MODE: agent-full-access' <<<"$agent_config"
          grep -Fq 'sandbox_mode = "danger-full-access"' deploy/onebrick/agent/config.toml
          grep -Fq 'approval_policy = "never"' deploy/onebrick/agent/config.toml
          grep -Fq '/workspace:ro' deploy/onebrick/compose.yml
          test "$(grep -c '^    read_only: true$' deploy/onebrick/compose.yml)" -ge 1
          grep -Fq 'reverse_proxy hive-relay:3000' deploy/onebrick/Caddyfile.hive
          grep -Fq 'header Accept *text/html*' deploy/onebrick/Caddyfile.hive
          grep -Fq 'redir @hiveBrowserRoot /app 302' deploy/onebrick/Caddyfile.hive
          rm -f "$fixture"
      - name: Reject tracked secrets and floating runtime images
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|auth\.json)$'
          ! git grep -nE '(OPENAI_API_KEY|CODEX_API_KEY|BRICKO_PRIVATE_KEY)=[^$<{].+' -- \
            deploy/onebrick scripts/hive-common.sh scripts/preflight.sh scripts/deploy.sh \
            scripts/healthcheck.sh scripts/backup.sh scripts/restore.sh scripts/restore-test.sh \
            scripts/upgrade.sh scripts/rollback.sh scripts/bootstrap-secrets.sh scripts/build-images.sh \
            ':!deploy/onebrick/.env.example'
          ! grep -E '^\s*image:\s+[^$].*:(latest|main)\s*$' deploy/onebrick/compose.yml

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build relay image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg RUST_IMAGE=rust:1.95-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1 \
            --build-arg NODE_IMAGE=node:24-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e \
            --build-arg DEBIAN_IMAGE=debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            --build-arg BUZZ_SOURCE_SHA="$GITHUB_SHA" \
            --tag "ghcr.io/bricko-brick/hive:sha-$GITHUB_SHA" \
            --cache-from type=gha,scope=hive-relay \
            --cache-to type=gha,mode=max,scope=hive-relay \
            --load
      - name: Build BrickO agent image
        run: |
          docker buildx build . \
            --file deploy/onebrick/Dockerfile.agent \
            --build-arg HIVE_SOURCE_SHA="$GITHUB_SHA" \
            --tag "ghcr.io/bricko-brick/hive-agent:sha-$GITHUB_SHA" \
            --cache-from type=gha,scope=hive-agent \
            --cache-to type=gha,mode=max,scope=hive-agent \
            --load
